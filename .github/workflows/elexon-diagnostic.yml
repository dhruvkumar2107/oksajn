name: Elexon Source Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/elexon-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Elexon historical publication windows
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://data.elexon.co.uk/bmrs/api/v1"
          windows = {
              "FUELHH": ("2026-01-10T00:00:00Z", "2026-01-11T00:00:00Z"),
              "WINDFOR": ("2026-01-10T00:00:00Z", "2026-01-11T00:00:00Z"),
          }
          for dataset, (start, end) in windows.items():
              url = f"{base}/datasets/{dataset}/stream"
              try:
                  query = urllib.parse.urlencode({"publishDateTimeFrom": start, "publishDateTimeTo": end})
                  request = urllib.request.Request(url + "?" + query, headers={"User-Agent": "WindSight-diagnostic/1.0"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      print(f"DATASET={dataset} STATUS={response.status} URL={response.url}")
                      payload = json.loads(response.read().decode("utf-8"))
                  rows = payload if isinstance(payload, list) else payload.get("data", [])
                  if not isinstance(rows, list):
                      rows = []
                  print(f"DATASET={dataset} COUNT={len(rows)}")
                  for row in rows[:2]:
                      if dataset == "FUELHH":
                          print("SAMPLE=" + json.dumps({k: row.get(k) for k in ("dataset", "fuelType", "startTime", "publishTime", "generation", "settlementDate", "settlementPeriod")}))
                      else:
                          print("SAMPLE=" + json.dumps({k: row.get(k) for k in ("dataset", "startTime", "publishTime", "generation", "settlementDate", "settlementPeriod")}))
              except Exception as exc:
                  print(f"DATASET={dataset} ERROR={type(exc).__name__}: {exc}")
                  raise
          PY

      - name: Exercise January 2026 ingestion pipeline
        run: |
          python -m pip install -r backend/requirements.txt
          python - <<'PY'
          import json
          from app import create_app
          from app.services.data_processor import ingest_and_evaluate_period

          app = create_app()
          with app.app_context():
              stats = ingest_and_evaluate_period("2026-01-01", "2026-02-01")
          print("JANUARY_2026_INGESTION_STATS=" + json.dumps(stats, default=str))
          PY
        env:
          PYTHONPATH: backend
          DB_PATH: ${{ runner.temp }}/windsight-elexon-diagnostic.db
          ELEXON_MAX_CONCURRENCY: "6"
          ELEXON_TIMEOUT: "20"
          ELEXON_MAX_RETRIES: "1"
