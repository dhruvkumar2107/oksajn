name: Elexon Source Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/elexon-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Elexon historical publication windows
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://data.elexon.co.uk/bmrs/api/v1"
          windows = {
              "FUELHH": ("2026-01-10T00:00:00Z", "2026-01-11T00:00:00Z"),
              "WINDFOR": ("2026-01-10T00:00:00Z", "2026-01-11T00:00:00Z"),
          }
          for dataset, (start, end) in windows.items():
              url = f"{base}/datasets/{dataset}/stream"
              try:
                  query = urllib.parse.urlencode({"publishDateTimeFrom": start, "publishDateTimeTo": end})
                  request = urllib.request.Request(url + "?" + query, headers={"User-Agent": "WindSight-diagnostic/1.0"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      print(f"DATASET={dataset} STATUS={response.status} URL={response.url}")
                      payload = json.loads(response.read().decode("utf-8"))
                  rows = payload if isinstance(payload, list) else payload.get("data", [])
                  if not isinstance(rows, list):
                      rows = []
                  print(f"DATASET={dataset} COUNT={len(rows)}")
                  for row in rows[:2]:
                      if dataset == "FUELHH":
                          print("SAMPLE=" + json.dumps({k: row.get(k) for k in ("dataset", "fuelType", "startTime", "publishTime", "generation", "settlementDate", "settlementPeriod")}))
                      else:
                          print("SAMPLE=" + json.dumps({k: row.get(k) for k in ("dataset", "startTime", "publishTime", "generation", "settlementDate", "settlementPeriod")}))
              except Exception as exc:
                  print(f"DATASET={dataset} ERROR={type(exc).__name__}: {exc}")
                  raise
          PY

      - name: Exercise January 2026 ingestion pipeline
        run: |
          python -m pip install -r backend/requirements.txt
          python - <<'PY'
          import json
          from app import create_app
          from app.services.data_processor import ingest_and_evaluate_period

          app = create_app()
          with app.app_context():
              stats = ingest_and_evaluate_period("2026-01-01", "2026-02-01")
          print("JANUARY_2026_INGESTION_STATS=" + json.dumps(stats, default=str))
          PY
        env:
          PYTHONPATH: backend
          DB_PATH: ${{ runner.temp }}/windsight-elexon-diagnostic.db
          ELEXON_MAX_CONCURRENCY: "6"
          ELEXON_TIMEOUT: "20"
          ELEXON_MAX_RETRIES: "1"

      - name: Backfill deployed dashboard and verify live summary
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://oksajn.onrender.com/api"

          def get_json(url, timeout=30):
              request = urllib.request.Request(url, headers={"User-Agent": "WindSight-live-backfill/1.0"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = get_json(base + "/health")
          print("LIVE_BACKEND_HEALTH=" + json.dumps(health))
          payload = json.dumps({"start_date": "2026-01-01", "end_date": "2026-02-01"}).encode("utf-8")
          request = urllib.request.Request(
              base + "/refresh",
              data=payload,
              method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "WindSight-live-backfill/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=300) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  print("LIVE_REFRESH_HTTP_STATUS=" + str(response.status))
                  print("LIVE_REFRESH_START_RESULT=" + json.dumps(result))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              print("LIVE_REFRESH_HTTP_ERROR=" + str(exc.code) + " " + detail)
              raise

          # New backend returns quickly with a job ID; continue to support the
          # previous synchronous response while Render deploys the new version.
          if result.get("status") == "started":
              refresh_id = result.get("refresh_id")
              assert refresh_id, "Refresh started without a refresh_id"
              deadline = time.monotonic() + 360
              while time.monotonic() < deadline:
                  job = get_json(base + f"/refresh/status/{refresh_id}")
                  print("LIVE_REFRESH_JOB_STATUS=" + json.dumps(job))
                  if job.get("status") in ("completed", "failed"):
                      break
                  time.sleep(4)
              assert job.get("status") == "completed", (
                  "Live refresh did not complete successfully: " + json.dumps(job)
              )
              print("LIVE_REFRESH_RESULT=" + json.dumps(job))
          else:
              assert result.get("status") == "success", (
                  "Refresh returned an unexpected response: " + json.dumps(result)
              )
              print("LIVE_REFRESH_RESULT=" + json.dumps(result))

          summary = get_json(base + "/summary?month=2026-01")
          print("LIVE_JANUARY_SUMMARY=" + json.dumps(summary))
          coverage = summary.get("coverage", {})
          assert coverage.get("total_intervals", 0) > 0, "Live dashboard still has no evaluation rows"
          assert coverage.get("intervals_with_actual", 0) > 0, "Live dashboard still has no actual data"
          assert coverage.get("intervals_with_forecast", 0) > 0, "Live dashboard still has no eligible forecasts"
          PY
