name: WindSight CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        env:
          DB_PATH: /tmp/windsight-test.db
        run: python -m pytest app/tests/ -v

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  docker-compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config
      - name: Build frontend and backend images
        run: docker compose build
      - name: Start the complete application
        run: docker compose up -d
      - name: Verify backend health and frontend proxy
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/api/health >/tmp/backend-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          cat /tmp/backend-health.json
          curl --fail --silent http://localhost/api/health
          echo
          curl --fail --silent "http://localhost/api/summary?month=2026-01"
          echo
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
